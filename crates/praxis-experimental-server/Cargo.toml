[package]
name = "praxis-experimental-server"
description = "Experimental Praxis AI gateway server composing the stock praxis-ai server with this workspace's filters"
repository = "https://github.com/praxis-proxy/experimental"
homepage = "https://github.com/praxis-proxy/experimental"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# praxis-ai-proxy's own feature is named "opentelemetry" (not "otel"); it
# gates AI-specific spans such as intelligent_route's routing.select
# (praxis-ai-filters/src/opentelemetry.rs). Without it, core request/filter
# spans still export, but AI routing-decision spans are compiled out.
otel = ["praxis-core/otel", "praxis-filter/otel", "praxis-ai-proxy/opentelemetry"]

# cargo-machete's source scan can't see these usages:
#  - praxis-experimental-filters is consumed by the discovery build script (its presence
#    as a direct dep, carrying the praxis-filters marker, is the point).
#  - praxis-ai-proxy is used as `praxis_ai::...` (lib name differs from package).
#  - praxis-core is used for `otel` feature forwarding.
#  - praxis-filter is referenced only in build-script-generated code.
[package.metadata.cargo-machete]
ignored = [
  "praxis-core",
  "praxis-experimental-filters",
  "praxis-ai-proxy",
  "praxis-filter",
  "praxis-protocol",
]

[[bin]]
name = "praxis-experimental-server"
path = "src/main.rs"

[dependencies]
# CLI argument parsing, matching praxis-ai's own bin (-c/--config).
clap = { version = "4.6.6", features = ["derive"] }

# Startup diagnostics (the "no config file found" warning).
tracing.workspace = true

# Direct dependency on the filters crate is what makes it discoverable: the
# build script scans this crate's direct runtime deps for the
# `[package.metadata.praxis-filters]` marker.
praxis-experimental-filters = { path = "../praxis-experimental-filters" }

# Praxis core, kept on the release used by the pinned ET AI revision so
# `SubRequestClient`, `Config`, and `FilterRegistry` share one Rust type graph.
# basic-auth-filter is off by default upstream, so a config naming `basic_auth`
# dies with "unknown filter type". It is the cheap gate for a human-driven client
# on a shared host; it is NOT usable in front of a coding agent, which sends its
# own Authorization header and would collide. See docs/quickstart.md.
praxis-filter = { workspace = true, features = [
  "basic-auth-filter",
  # The Praxis Policy Engine, off by default upstream. It is the only thing in
  # this image that can validate a per-caller credential: multi-source JWT
  # identity, APL route policy and RFC 8693 token exchange. Without it the
  # gateway can swap a client key for a provider key but cannot check the client
  # key. See demos/ai-gateway/docs/quickstart.md.
  "policy-engine",
] }
# This direct dependency forwards this crate's `otel` feature to Core. Runtime
# construction uses the stock AI helper below rather than duplicating Core APIs.
praxis-core.workspace = true
# praxis-ai-proxy's server constructs AdminEndpointOptions, which
# praxis-proxy-protocol gates behind its `admin-api` feature without
# enabling it itself. Declaring it here lets Cargo feature unification
# turn it on for the whole graph. Not referenced from our own code.
praxis-protocol = { workspace = true, features = ["admin-api"] }

# The stock praxis-ai server. praxis-ai crates are `publish = false`, so this
# stays a git dependency pinned to the reviewed ET source revision.
#
# AI now defaults to its smaller `standard` feature set. `full` explicitly
# preserves the pre-split image surface: OpenAI Responses, Conversations,
# compaction, MCP tools, file resolution, and the PostgreSQL response store.
#
# `http-callout-filter` is off by default upstream because its config surface is
# still moving. This image exists to expose experimental work, so it is on here
# — it is what backs the Lakera Guard example config.
praxis-ai-proxy = { workspace = true, features = [
  "full",
  "token-rate-limit-filter",
  "http-callout-filter",
] }

[build-dependencies]
cargo_metadata = "0.23.1"
praxis-ai-build-support.workspace = true
