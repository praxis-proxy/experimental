[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
  # Unmaintained transitive deps pinned by the praxis 0.5.2 / pingora-fork
  # (quixotic-plecostomus 0.8.2) tree; not fixable from this workspace.
  # Revisit on every praxis/pingora bump.
  { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, via pingora-fork proxy crates" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, via pingora-fork rustls stack" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # MIT No Attribution (OSI approved): borrow-or-share, via
  # jsonschema <- switchyard-libsy.
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# praxis-ai crates are publish = false and only consumable as git dependencies;
# switchyard-server pins them to an exact rev.
allow-git = ["https://github.com/praxis-proxy/ai"]
