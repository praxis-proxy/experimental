[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
# Transitive dependencies of the Pingora fork, reached through praxis-ai.
# Not under our control; mirrors the ignore lists in praxis-proxy/praxis and
# praxis-proxy/ai.
ignore = [
  # derivative 2.2.0: unmaintained
  "RUSTSEC-2024-0388",
  # unsafe-libyaml 0.2.11: unmaintained, inherited through the pinned AI
  # v0.4.1 release and Praxis core's serde_yaml 0.9.34. Our own YAML parser
  # already uses yaml_serde; remove this exception when upstream migrates.
  "RUSTSEC-2024-0449",
  # rustls-pemfile 2.2.0: unmaintained
  "RUSTSEC-2025-0134",
  # lru 0.16.4: unsound LruCache::pop() panic safety, via
  # quixotic-plecostomus-cache / -pool
  "RUSTSEC-2026-0253",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # Via Switchyard → jsonschema → referencing → fluent-uri → borrow-or-share.
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The unpublished AI crates come from the reviewed ET fork revision pinned in
# Cargo.toml and Cargo.lock. Core Praxis remains a crates.io dependency.
allow-git = [
  "https://github.com/redhat-et/praxis-ai",
  # The pinned AI fork uses this pinned SQLx fork for its storage backends.
  "https://github.com/praxis-proxy/sqlx",
]
