[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
# Transitive dependencies of the Pingora fork, reached through praxis-ai.
# Not under our control; mirrors the ignore lists in praxis-proxy/praxis and
# praxis-proxy/ai.
ignore = [
  # derivative 2.2.0: unmaintained
  "RUSTSEC-2024-0388",
  # rustls-pemfile 2.2.0: unmaintained
  "RUSTSEC-2025-0134",
  # lru 0.16.4: unsound LruCache::pop() panic safety, via
  # quixotic-plecostomus-cache / -pool
  "RUSTSEC-2026-0253",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# praxis-ai crates are publish = false and only consumable as git dependencies;
# praxis-experimental-server pins them to an exact rev.
allow-git = ["https://github.com/praxis-proxy/ai"]
