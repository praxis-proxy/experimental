  - { id: independent-policies, kind: slide, source: slides/independent-policies.html, narration: narration/independent-policies.txt }
  - { id: soft-token-limits, kind: slide, source: slides/soft-token-limits.html, narration: narration/soft-token-limits.txt }
  - { id: live-demo, kind: video, source: source/grid-burst-sim.mp4, narration: narration/live-demo.txt }
  - { id: outro, kind: slide, source: slides/outro.html, narration: narration/outro.txt }
evidence:
  required: [source_recording, slide_render, tts_audio, final_video, playwright_review, duration_check, pause_check]
