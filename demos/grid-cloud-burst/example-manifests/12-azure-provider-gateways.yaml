---
apiVersion: v1
kind: Service
metadata: {name: azure-east, namespace: grid-system}
spec:
  selector: {app.kubernetes.io/instance: azure-east, app.kubernetes.io/name: praxis-gateway}
  ports: [{name: https-mtls, port: 8443, targetPort: https-mtls}]
---
apiVersion: v1
kind: Service
metadata: {name: azure-west, namespace: grid-system}
spec:
  selector: {app.kubernetes.io/instance: azure-west, app.kubernetes.io/name: praxis-gateway}
