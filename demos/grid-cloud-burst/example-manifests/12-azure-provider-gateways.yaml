apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-east
  namespace: grid-system
  labels: {app.kubernetes.io/instance: azure-east, app.kubernetes.io/name: praxis-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/instance: azure-east, app.kubernetes.io/name: praxis-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/instance: azure-east, app.kubernetes.io/name: praxis-gateway}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: burst-registry-pull-current}, {name: burst-registry-pull}]
      containers:
        - name: praxis
          image: ${AZURE_IMAGE}
          args: [--config, /etc/praxis/praxis.yaml]
          ports: [{containerPort: 8443, name: https-mtls}]
          env:
            - name: AZURE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: azure-openai-client-secret, key: client-secret}}
          readinessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/praxis, readOnly: true}
            - {name: tls, mountPath: /etc/praxis/tls, readOnly: true}
      volumes:
        - {name: config, configMap: {name: azure-east-config}}
        - {name: tls, secret: {secretName: gateway-tls}}
---
