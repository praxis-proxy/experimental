# Template for the dedicated Azure provider gateways. Render this file with
# the deployment script; placeholders are never valid credential values.
# The gateway uses the same mTLS server secret as the demo gateways, while the
# Entra client secret is injected only as AZURE_CLIENT_SECRET from a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-east-config
  namespace: grid-system
data:
  praxis.yaml: |
    listeners:
      - name: provider
        address: 0.0.0.0:8443
        filter_chains: [provider-inference]
        tls:
          certificates:
            - cert_path: /etc/praxis/tls/tls.crt
              key_path: /etc/praxis/tls/tls.key
          client_ca: {ca_path: /etc/praxis/tls/ca.crt}
          client_cert_mode: require
    filter_chains:
      - name: provider-inference
        filters:
          - filter: peer_identity_trust
            trusted_peers: [{organization: ai-grid}]
          - filter: provider_route
            provider_id: azure-east
            model_header: X-Model
            emit_demo_attribution: true
            routes:
              - candidate_id: ${AZURE_EAST_CANDIDATE_ID}
                model: gpt-4o-mini
                provider_model: gpt-4o-mini
                paths: [/v1/chat/completions, /v1/responses]
                cluster: azure-upstream
          - filter: path_rewrite
            replace:
              pattern: "^/v1/chat/completions/?$"
              replacement: /openai/v1/chat/completions
            conditions:
              - when: {path: /v1/chat/completions, methods: [POST]}
          - filter: azure_ad
            tenant_id: ${AZURE_TENANT_ID}
            client_id: ${AZURE_CLIENT_ID}
            scope: https://cognitiveservices.azure.com/.default
            client_secret_env_var: AZURE_CLIENT_SECRET
          - filter: load_balancer
            clusters:
              - name: azure-upstream
                http: {authority: ${AZURE_OPENAI_HOST}}
                endpoints: [${AZURE_OPENAI_HOST}:443]
                tls: {sni: ${AZURE_OPENAI_HOST}, verify: true}
                idle_timeout_ms: 5000
    insecure_options: {allow_private_endpoints: false}
    admin: {address: 127.0.0.1:9901}
    shutdown_timeout_secs: 5
    telemetry:
      otlp_endpoint: http://jaeger-collector.grid-system.svc.cluster.local:4317
      sampling_rate: 1.0
---
