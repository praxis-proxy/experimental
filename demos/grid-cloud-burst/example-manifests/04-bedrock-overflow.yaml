# A distinct overflow provider. Its adapter is deliberately outside Praxis;
# this manifest only describes the generic HTTP provider hop.
apiVersion: grid.praxis-proxy.io/v1alpha1
kind: GridSite
metadata:
  name: static-bedrock
  namespace: grid-system
  labels: { grid.praxis-proxy.io/provider-site: static-bedrock }
spec:
  gridNetworkRef: grid-token-rate-limit
  region: external-cloud
  zone: bedrock
  egress:
    address: __BEDROCK_GATEWAY_IP__:8443
    tls: { mode: Mutual, serverName: west.grid.internal }
  trust:
    canonicalFingerprints: ["__WEST_FINGERPRINT__"]
---
apiVersion: grid.praxis-proxy.io/v1alpha1
kind: InferenceProvider
metadata:
  name: static-bedrock
  namespace: grid-system
spec:
  gridNetworkRef: grid-token-rate-limit
  providerKind: bedrock
  backendKind: api_provider
  endpoint: __BEDROCK_ENDPOINT__
  capacityWeight: __BEDROCK_WEIGHT__
  models: [{ name: gpt-4o-mini, capabilities: [text_generation], contextWindow: 4096 }]
  siteSelector: { matchLabels: { grid.praxis-proxy.io/provider-site: static-bedrock } }
  accessPolicy: { siteSelector: { matchLabels: {} } }
  healthCheck: { path: /health, interval: 30s, timeout: 5s }
