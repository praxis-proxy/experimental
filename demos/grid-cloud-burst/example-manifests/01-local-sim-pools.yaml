# Deterministic single-cluster provider pools for the cloud-burst proof.
# The simulator reports a controlled queue value independent of inference load.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-sim-a-config
  namespace: grid-system
data:
  config.yaml: |
    port: 8000
    model: "gpt-4o-mini"
    served-model-name: ["gpt-4o-mini"]
    mode: "echo"
    force-dummy-tokenizer: true
    max-num-seqs: 4
    max-waiting-queue-length: 128
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-sim-b-config
  namespace: grid-system
data:
  config.yaml: |
    port: 8000
    model: "gpt-4o-mini"
    served-model-name: ["gpt-4o-mini"]
    mode: "echo"
    force-dummy-tokenizer: true
    max-num-seqs: 4
    max-waiting-queue-length: 128
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-sim-c-config
  namespace: grid-system
data:
  config.yaml: |
    port: 8000
    model: "gpt-4o-mini"
    served-model-name: ["gpt-4o-mini"]
    mode: "echo"
    force-dummy-tokenizer: true
    max-num-seqs: 4
    max-waiting-queue-length: 128
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-sim-a
  namespace: grid-system
  labels: { app.kubernetes.io/name: llm-d-inference-sim, grid.praxis-proxy.io/pool: static-a }
spec:
  replicas: 1
  selector: { matchLabels: { grid.praxis-proxy.io/pool: static-a } }
  template:
    metadata: { labels: { app.kubernetes.io/name: llm-d-inference-sim, grid.praxis-proxy.io/pool: static-a } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/config.yaml"]
          ports: [{ name: http, containerPort: 8000 }]
          volumeMounts: [{ name: config, mountPath: /config, readOnly: true }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes: [{ name: config, configMap: { name: static-sim-a-config } }]
---
