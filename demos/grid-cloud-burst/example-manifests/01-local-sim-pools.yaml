---
apiVersion: v1
kind: Service
metadata: { name: static-sim-a, namespace: grid-system }
spec:
  selector: { grid.praxis-proxy.io/pool: static-a }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
