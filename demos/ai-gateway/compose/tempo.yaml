# Single-binary Tempo. Mirrors the settings the KIND target sets through the
# grafana/tempo Helm chart values in ../forge.yaml, so both targets derive the
# same span metrics.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          # Matches the KIND target's tempo values in forge.yaml. The collector's
          # send_batch_max_size caps span COUNT, not bytes, so this receiver limit
          # is the actual guarantee that a large batch is not rejected. Nothing
          # fails at demo volumes; it matters under the otel-benchmark load, and
          # letting the two targets differ here would make a failure reproduce on
          # one and not the other.
          max_recv_msg_size_mib: 32
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
