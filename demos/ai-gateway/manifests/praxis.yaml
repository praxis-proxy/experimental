# Praxis Deployment for the ai-gateway demo.
# ConfigMap is created by the praxis-deploy stack (forge.yaml)
# or by `kubectl create configmap praxis-config --from-file=praxis.yaml=<config>`
# when switching between the files in configs/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis-proxy
  template:
    metadata:
      labels:
        app: praxis-proxy
    spec:
      containers:
        - name: praxis-proxy
          image: praxis-experimental:ai-gw
          # Explicit config path. The image's WORKDIR is /etc/praxis so the
          # bare entrypoint would resolve praxis.yaml anyway, but relying on
          # that is fragile -- state it where a reader of this manifest sees it.
          args: ["-c", "/etc/praxis/praxis.yaml"]
          env:
            # The config deliberately omits telemetry.otlp_endpoint so the same
            # file also works under compose; praxis-core reads this instead.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.otel.svc:4317"
            - name: OTEL_SERVICE_NAME
              value: praxis
          # Provider variables consumed by credential_injection. demo-kind always
          # creates all three keys; an empty value starts successfully and leaves
          # that provider unavailable without blocking Ollama.
          envFrom:
            - secretRef:
                name: praxis-provider-keys
          ports:
            - containerPort: 8080
              name: proxy
            - containerPort: 8081
              name: anthropic
            - containerPort: 8082
              name: openrouter
            - containerPort: 9901
              name: admin
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthy
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthy
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-proxy
  namespace: default
  labels:
    app: praxis-proxy
spec:
  type: NodePort
  selector:
    app: praxis-proxy
  ports:
    # All three gateway listeners, not just :8080 -- configs/laptop.yaml serves
    # Anthropic on :8081 and OpenRouter on :8082, and without these the KIND
    # entry point silently reaches only the OpenAI-compatible chain.
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: proxy
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: anthropic
    - port: 8082
      targetPort: 8082
      nodePort: 30082
      name: openrouter
    - port: 9901
      targetPort: 9901
      nodePort: 30901
      name: admin
