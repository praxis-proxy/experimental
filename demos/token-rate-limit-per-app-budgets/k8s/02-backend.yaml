# Minimal OpenAI-shaped backend so admitted requests get a real 200 with
# token usage data, exercising reservation reconciliation as well as
# admission/denial. `usage.total_tokens` is deliberately kept fixed at 10 --
# not randomized -- because silver-tier's deterministic single-request
# exhaustion (see ../README.md's tuning notes) depends on that exact value;
# everything else (id, created, and a small realistic processing delay) is
# now randomized per request so the wire response is never byte-identical
# twice, unlike the original docker-compose stub.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-script
  namespace: trl-demo
data:
  backend.py: |
    import json, random, time, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            if length:
                self.rfile.read(length)
            # Real, non-zero, varying processing latency -- not instantaneous,
            # not identical between requests.
            time.sleep(random.uniform(0.008, 0.045))
            body = json.dumps({
                "id": f"chatcmpl-{uuid.uuid4().hex[:24]}",
                "object": "chat.completion",
                "created": int(time.time()),
                "choices": [
                    {"index": 0, "message": {"role": "assistant", "content": "hi"}, "finish_reason": "stop"}
                ],
                "usage": {"prompt_tokens": 5, "completion_tokens": 5, "total_tokens": 10},
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_args):
            pass

    HTTPServer(("0.0.0.0", 3000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trl-demo
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/srv/backend.py"]
          volumeMounts:
            - name: script
              mountPath: /srv
          ports:
            - containerPort: 3000
      volumes:
        - name: script
          configMap:
            name: backend-script
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trl-demo
spec:
  selector: { app: backend }
  ports:
    - port: 3000
      targetPort: 3000
