# Minimal OpenAI-shaped backend so admitted requests get a real 200 with
# token usage data, exercising reservation reconciliation as well as
# admission/denial. `usage.total_tokens` is deliberately tier-aware (read
# from the `x-tier` header, which the router forwards through unmodified)
# rather than a single fixed constant -- it must exactly equal whatever
# ../config.yaml sets as that tier's `estimate_tokens` (15 gold, 7 silver),
# or reconciliation's actual-vs-estimate delta silently over/under-drains
# the budget relative to the demo's intended arithmetic (see
# ../config.yaml's comment and recording/RECORDING.md's "Correction"
# section). Everything else (id, created, and a small realistic processing
# delay) is randomized per request so the wire response is never
# byte-identical twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-script
  namespace: trl-demo
data:
  backend.py: |
    import json, random, time, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # Must track config.yaml's estimate_tokens per tier exactly -- see the
    # ConfigMap-level comment above for why a mismatch matters.
    TOTAL_TOKENS_BY_TIER = {"gold": 15, "silver": 7}

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            if length:
                self.rfile.read(length)
            # Real, non-zero, varying processing latency -- not instantaneous,
            # not identical between requests.
            time.sleep(random.uniform(0.008, 0.045))
            tier = self.headers.get("x-tier", "")
            total_tokens = TOTAL_TOKENS_BY_TIER.get(tier, 10)
            prompt_tokens = total_tokens // 2
            body = json.dumps({
                "id": f"chatcmpl-{uuid.uuid4().hex[:24]}",
                "object": "chat.completion",
                "created": int(time.time()),
                "choices": [
                    {"index": 0, "message": {"role": "assistant", "content": "hi"}, "finish_reason": "stop"}
                ],
                "usage": {
                    "prompt_tokens": prompt_tokens,
                    "completion_tokens": total_tokens - prompt_tokens,
                    "total_tokens": total_tokens,
                },
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_args):
            pass

    HTTPServer(("0.0.0.0", 3000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trl-demo
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/srv/backend.py"]
          volumeMounts:
            - name: script
              mountPath: /srv
          ports:
            - containerPort: 3000
      volumes:
        - name: script
          configMap:
            name: backend-script
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trl-demo
spec:
  selector: { app: backend }
  ports:
    - port: 3000
      targetPort: 3000
