apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: trl-demo
  labels: { app: valkey }
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8-alpine
          command: ["valkey-server", "--save", ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 2
            failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: trl-demo
spec:
  selector: { app: valkey }
  ports:
    - port: 6379
      targetPort: 6379
