      containers:
        - name: app
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/srv/app.py"]
          env:
            - name: APP_ID
              value: "app-b"
            - name: TIER
              value: "silver"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          volumeMounts:
            - name: script
              mountPath: /srv
          ports:
            - containerPort: 4000
      volumes:
        - name: script
          configMap: { name: app-script }
