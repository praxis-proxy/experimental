# Demo fixture for the token-rate-limit-per-app-budgets demo (see the
# sibling README.md). Both gateway instances in docker-compose.yml load
# this same config, pointed at the same Valkey backend: that's what
# makes their per-app budgets shared rather than independent. Deliberately
# small window/capacity values so the curl walkthrough exhausts a budget
# after exactly one request.
#
# Source: examples/configs/token-rate-limit-per-app.yaml on
# https://github.com/jordigilh/ai/tree/jordigilh/token-rate-limit-per-app-budgets

listeners:
  - name: default
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend

      - filter: token_rate_limit
        window: 1h                    # sliding window duration, per app
        capacity: 40                  # each app's budget within the window, in tokens
        estimate_tokens: 40           # cost reserved per request at admission
        bucket_key_header: x-app-id   # one independent budget per app
        backend:
          kind: valkey                # shared across every gateway instance/replica
          url: "${TOKEN_RATE_LIMIT_VALKEY_URL}"
          namespace: praxis-demo:token-rate-limit-per-app

      - filter: token_count
        provider: openai   # openai | anthropic | google | bedrock | azure

      - filter: access_log

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "backend:3000"
