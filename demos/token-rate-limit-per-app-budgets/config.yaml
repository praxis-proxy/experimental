# Demo fixture for the token-rate-limit-per-app-budgets demo (see the
# sibling README.md). Deliberately small burst/estimate values so the
# curl walkthrough exhausts a budget after exactly one request, instead
# of the production-sized example config on the source branch.
#
# Source: examples/configs/token-rate-limit-per-app.yaml on
# https://github.com/jordigilh/ai/tree/jordigilh/token-rate-limit-per-app-budgets

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend

      - filter: token_rate_limit
        rate: 0.0001                  # negligible refill during a short demo
        burst: 40                     # each app's budget, in tokens
        estimate_tokens: 40           # cost reserved per request at admission
        bucket_key_header: x-app-id   # one independent bucket per app

      - filter: token_count
        provider: openai   # openai | anthropic | google | bedrock | azure

      - filter: access_log

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"
