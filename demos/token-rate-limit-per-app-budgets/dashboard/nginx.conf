# Same-origin dashboard + reverse proxy for the token-rate-limit-per-app-budgets
# demo. Proxying /a/ and /b/ under one origin avoids CORS preflight entirely for
# the dashboard's fetch() calls (x-app-id is not a CORS-safelisted header) --
# nginx does not exist in the request path Praxis AI evaluates the filter
# chain against, it is purely a browser-facing convenience for the recording.
server {
    listen 3000;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /a/ {
        proxy_pass http://gateway-a:8080/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location /b/ {
        proxy_pass http://gateway-b:8080/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
