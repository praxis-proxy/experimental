# Same-origin dashboard + reverse proxy for the token-rate-limit-per-app-budgets
# demo. Proxies to the app-a/app-b/app-c pods (K8s), which each make their own
# real, server-side call to a gateway -- the dashboard never talks to a
# gateway directly, so "which app sent this" is a real separate pod, not a
# header value picked in the browser. Proxying under one origin also avoids
# CORS preflight for the dashboard's fetch() calls.
#
# `proxy_buffering off` + a long `proxy_read_timeout` are required for
# /apps/*/gw-logs -- a long-lived Server-Sent-Events stream of each gateway
# pod's real stdout -- or nginx would buffer/chunk it into large delayed
# blocks (or time it out) instead of forwarding lines as they arrive.
server {
    listen 3000;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /apps/app-a/ {
        proxy_pass http://app-a:4000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /apps/app-b/ {
        proxy_pass http://app-b:4000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /apps/app-c/ {
        proxy_pass http://app-c:4000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
