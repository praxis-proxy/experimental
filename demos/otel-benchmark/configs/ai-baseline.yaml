# AI baseline benchmark config (no OTel).
# Same extended filter chain as ai-otel-full.yaml, without telemetry, so
# the OTel overhead comparison is apples-to-apples.
# intelligent_route is the sole cluster-selecting filter (see
# ai-otel-full.yaml for why `router` is not used alongside it); the `ai`
# benchmark scenario only sends POST /v1/chat/completions traffic, which
# intelligent_route routes to inference-sim.

admin:
  address: "0.0.0.0:9901"

insecure_options:
  allow_public_admin: true

listeners:
  - name: default
    address: "0.0.0.0:8080"
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: request_id
      - filter: access_log

      - filter: model_to_header

      - filter: token_usage_headers

      - filter: token_count
        provider: openai

      - filter: time_to_first_token

      - filter: intelligent_route
        local_site: site-a
        model_header: X-Model
        candidates:
          - kind: inference_model
            name: test-model
            site: site-a
            cluster: inference
            fresh: true

          - kind: inference_model
            name: test-model
            site: site-a
            cluster: echo
            fresh: false

      - filter: load_balancer
        clusters:
          - name: echo
            endpoints:
              - "echo-backend.default.svc:8080"
          - name: inference
            endpoints:
              - "inference-sim.default.svc:8000"
