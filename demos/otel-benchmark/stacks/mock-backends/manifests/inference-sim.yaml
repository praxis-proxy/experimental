apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-sim
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-sim
  template:
    metadata:
      labels:
        app: inference-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
          args: ["--port", "8000", "--model", "test-model", "--mode", "random"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-sim
  namespace: default
spec:
  selector:
    app: inference-sim
  ports:
    - port: 8000
      targetPort: 8000
